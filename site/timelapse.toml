code = '''
use bullseye::{Color, Constraint, Layout, LogicalInsets, LogicalRect,
    Sense, Text, Ui, WidgetId, widgets::Rectangle};

struct Counter {
    count: u32,
}

impl Counter {
    fn render(&mut self, ui: &mut Ui, area: LogicalRect) {
        let [button, count] = Layout::default()
            .spacing(12.0)
            .constraints([Constraint::Length(110.0), Constraint::Min(0.0)])
            .areas(area);

        let id = ui.id(WidgetId::new("counter increment"));
        let interaction = ui.interact(id, button, Sense::CLICK);
        if interaction.pressed || interaction.clicked {
            ui.invalidate(button);
        }
        Rectangle::new(button)
            .background(if interaction.pressed || interaction.clicked {
                Color::from_rgba8(70, 110, 190, 255)
            } else {
                Color::from_rgba8(45, 55, 70, 255)
            })
            .render(ui);
        Text::new("Increment")
            .in_area(button.inset(LogicalInsets::uniform(8.0)))
            .color(Color::WHITE)
            .render(ui);

        if interaction.clicked {
            self.count += 1;
        }

        let label = format!("Count: {}", self.count);
        Text::new(&label).in_area(count).color(Color::WHITE).render(ui);
    }
}
'''

[[revision]]
commit = "3b4115f"
date = "2026-08-22"
title = "blit: improve container builder pattern"
source = "core/src/widget/mod.rs, core/src/container.rs, core/src/lib.rs"
code = '''
use blit::{Appearance, Ui, color::Color, geometry::LogicalInsets,
    interact::{Sense, WidgetId}, widget::{Text, Widget}};

struct Counter {
    count: u32,
}

impl Widget for &mut Counter {
    type Output = ();

    fn build(self, ui: &mut Ui) {
        let id = WidgetId::new("counter increment");
        let interaction = ui.interact(id, Sense::CLICK);
        let mut row = ui.container().row().gap(12.0).open();

        {
            let mut button = row.container()
                .row()
                .id(id)
                .padding(LogicalInsets::uniform(8.0))
                .appearance(Appearance::new().background(if interaction.pressed {
                    Color::from_rgba8(70, 110, 190, 255)
                } else {
                    Color::from_rgba8(45, 55, 70, 255)
                }))
                .open();
            button.add(Text::new("Increment").color(Color::WHITE));
        }

        if interaction.clicked {
            self.count += 1;
        }

        let label = format!("Count: {}", self.count);
        row.add(Text::new(&label).color(Color::WHITE));
    }
}
'''

