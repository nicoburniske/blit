[[revision]]
commit = "9f8654c"
date = "2026-07-11"
title = "wip | initial immediate drawing"
source = "src/lib.rs, src/layout.rs, src/text.rs"
code = '''
use bullseye::{Color, Constraint, Input, Layout, Point, Rect, Text, Ui};

struct Counter {
    count: u32,
}

impl Counter {
    fn render(&mut self, ui: &mut Ui, area: Rect) {
        let [button, count] = Layout::default()
            .spacing(12.0)
            .constraints([Constraint::Length(110.0), Constraint::Min(0.0)])
            .areas(area);

        let clicked = matches!(ui.input(), Input::PointerUp { x, y }
            if button.contains(*x, *y));
        if clicked {
            ui.invalidate(button);
        }
        ui.fill_rect(button, if clicked {
            Color::from_rgba8(70, 110, 190, 255)
        } else {
            Color::from_rgba8(45, 55, 70, 255)
        });
        Text::new("Increment")
            .at(Point { x: button.x + 8.0, y: button.y + 8.0 })
            .color(Color::WHITE)
            .render(ui);

        if clicked {
            self.count += 1;
        }

        let label = format!("Count: {}", self.count);
        Text::new(&label)
            .in_area(count)
            .color(Color::WHITE)
            .render(ui);
    }
}
'''

