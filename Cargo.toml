[workspace]
resolver = "2"
members = [
    "desktop",
    "examples",
    "executor",
    "gui",
    "gui/cpu",
    "gui/gpu",
    "gui/raster",
    "gui/text",
    "gui/text/cosmic",
    "gui/text/fontdue",
    "internal/cache",
    "internal/arrayvec",
    "kernel",
    "layout",
    "tui",
    "widgets",
]

[workspace.package]
license = "MIT"

[workspace.dependencies]
blit = { path = "kernel" }
blit-executor = { path = "executor" }
blit-gui = { path = "gui" }
blit-gpu = { path = "gui/gpu" }
blit-layout = { path = "layout" }
blit-widgets = { path = "widgets" }
blit-text = { path = "gui/text" }
blit-text-cosmic = { path = "gui/text/cosmic" }
blit-text-fontdue = { path = "gui/text/fontdue" }
blit-arrayvec = { path = "internal/arrayvec" }
blit-cache = { path = "internal/cache" }
blit-raster = { path = "gui/raster" }
wgpu = { version = "30.0.1", default-features = false }
