[workspace]
resolver = "2"
members = [
    "cache",
    "core",
    "examples/showcase",
    "executor",
    "font",
    "platform/desktop",
    "platform/terminal",
    "render/cpu",
    "render/term",
]

[workspace.package]
license = "MIT"

[workspace.dependencies]
blit = { path = "core" }
blit-executor = { path = "executor" }
blit-font = { path = "font" }
blit-showcase = { path = "examples/showcase" }
