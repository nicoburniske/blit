[workspace]
resolver = "2"
members = [
    "desktop",
    "examples",
    "executor",
    "gui",
    "gui/cpu",
    "gui/text",
    "gui/text/cosmic",
    "gui/text/fontdue",
    "internal/cache",
    "internal/diff",
    "internal/arrayvec",
    "kernel",
    "layout",
    "internal/widgets",
    "tui",
]

[workspace.package]
license = "MIT"

[workspace.dependencies]
blit = { path = "kernel" }
blit-diff = { path = "internal/diff" }
blit-executor = { path = "executor" }
blit-gui = { path = "gui" }
blit-layout = { path = "layout" }
blit-widgets = { path = "internal/widgets" }
blit-text = { path = "gui/text" }
blit-text-cosmic = { path = "gui/text/cosmic" }
blit-text-fontdue = { path = "gui/text/fontdue" }
blit-arrayvec = { path = "internal/arrayvec" }
