[workspace]
resolver = "2"
members = [
    "desktop",
    "examples",
    "executor",
    "gui",
    "gui/widget",
    "gui/cpu",
    "gui/gpu",
    "gui/text",
    "gui/text/parley",
    "kernel",
    "profile",
    "tui",
    "util",
    "widget",
]

[workspace.package]
license = "MIT"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
chunks_exact_to_as_chunks = "allow"

[workspace.dependencies]
blit = { path = "kernel" }
blit-executor = { path = "executor" }
blit-gui = { path = "gui" }
blit-gui-widget = { path = "gui/widget" }
blit-gpu = { path = "gui/gpu" }
blit-profile = { path = "profile" }
blit-widget = { path = "widget" }
blit-text = { path = "gui/text" }
blit-text-parley = { path = "gui/text/parley" }
blit-util = { path = "util" }
hashbrown = "0.17.1"
libm = "0.2.16"
rustc-hash = { version = "2.1.3", default-features = false }
wgpu = { version = "30.0.1", default-features = false }
