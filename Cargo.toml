[workspace]
resolver = "2"
members = [
    "desktop",
    "examples",
    "executor",
    "gui",
    "gui/widgets",
    "gui/cpu",
    "gui/gpu",
    "gui/text",
    "gui/text/parley",
    "internal/cache",
    "internal/arrayvec",
    "internal/arena",
    "kernel",
    "layout",
    "tui",
    "widgets",
]

[workspace.package]
license = "MIT"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
chunks_exact_to_as_chunks = "allow"

[workspace.dependencies]
blit = { path = "kernel" }
blit-executor = { path = "executor" }
blit-gui = { path = "gui" }
blit-gui-widgets = { path = "gui/widgets" }
blit-gpu = { path = "gui/gpu" }
blit-layout = { path = "layout" }
blit-widgets = { path = "widgets" }
blit-text = { path = "gui/text" }
blit-text-parley = { path = "gui/text/parley" }
blit-arrayvec = { path = "internal/arrayvec" }
blit-arena = { path = "internal/arena" }
blit-cache = { path = "internal/cache" }
hashbrown = "0.17.1"
wgpu = { version = "30.0.1", default-features = false }
