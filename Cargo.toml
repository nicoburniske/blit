[workspace]
resolver = "2"
members = [
    "cache",
    "diff",
    "examples/showcase",
    "executor",
    "kernel",
    "platform/desktop",
    "platform/tui",
    "render/cpu",
    "render/text",
    "render/text-cosmic",
    "render/text-fontdue",
    "render/tui",
    "std",
]

[workspace.package]
license = "MIT"

[workspace.dependencies]
blit = { path = "kernel" }
blit-diff = { path = "diff" }
blit-executor = { path = "executor" }
blit-showcase = { path = "examples/showcase" }
blit-std = { path = "std" }
blit-text = { path = "render/text" }
blit-text-cosmic = { path = "render/text-cosmic" }
blit-text-fontdue = { path = "render/text-fontdue" }
