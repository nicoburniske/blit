[package]
name = "blit-demo"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
autoexamples = false

[features]
default = ["cpu"]
cpu = ["blit-desktop/cpu", "dep:blit-cpu"]
gpu = ["blit-desktop/gpu", "dep:blit-gpu", "dep:wgpu", "dep:bytemuck"]

[lib]
path = "demo.rs"

[dependencies]
blit-layout.workspace = true
blit.workspace = true
blit-widgets.workspace = true
blit-desktop = { path = "../desktop", default-features = false }
blit-gui.workspace = true
blit-gui-widgets.workspace = true
blit-cpu = { path = "../gui/cpu", optional = true }
blit-gpu = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
blit-text-parley.workspace = true
blit-text.workspace = true
blit-tui = { path = "../tui" }

[[example]]
name = "desktop-demo"
path = "desktop.rs"

[[example]]
name = "tui-demo"
path = "tui.rs"

[[example]]
name = "readme"
path = "readme.rs"

[lints]
workspace = true
