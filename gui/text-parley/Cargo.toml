[package]
name = "blit-text-parley"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[features]
default = ["system"]
system = ["parley/system"]

[dependencies]
blit.workspace = true
blit-gui.workspace = true
blit-util.workspace = true
parley = { version = "0.12", default-features = false, features = ["std"] }
swash = { version = "0.2", default-features = false, features = ["render", "scale", "std"] }

[lints]
workspace = true
