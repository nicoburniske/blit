<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blit / Canvas</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #0e1321; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #error { position: fixed; inset: 24px; color: white; font: 16px system-ui; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <canvas aria-label="Interactive Blit canvas"></canvas>
    <div id="error" hidden></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
